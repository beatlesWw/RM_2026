####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyUSB0"  #com_port: "/dev/gimbal"  "/dev/ttyUSB0"  "/dev/tnt0"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035  # 原来0.0035，临时放宽到约1.1度测试  2.24日前是 0.02

max_yaw_acc: 50  #单位：弧度/秒的平方  原来：50
Q_yaw: [9e6, 0]
R_yaw: [1]     #原来：[1]  这是2.24前的
# Q_yaw: [9e6, 1e4]      # 增加速度误差惩罚
