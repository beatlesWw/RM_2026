enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU  #原来GPU ——OpenVINO用来推理的设备
min_confidence: 0.8 #0.8原来
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false  #原来：false

#####-----传统方法参数-----#####
threshold: 150  #原来：150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20  #长宽比
min_lightbar_length: 8   #单位：像素（灯条在可视化页面最小能够检测的长度）
min_armor_ratio: 1
max_armor_ratio: 5  #长短灯条最大长宽比
max_side_ratio: 1.5 #最大矩形误差
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 5
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0 # degree -2.5  #原来：2    3.4日前是：-4.2
pitch_offset: 0 # degree 2  #原来6.5      3.4日前是：1.1 
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.00 # s   原来：0.0
low_speed_delay_time: 0.0 # s planner use this value  #原来0.0

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----相机参数-----#####
camera_name: "galaxy"
exposure_ms: 5
gain: 10   #原来：16.9
vid_pid: "" #原来：2bdf:0001  老三：2ba2:4d55

#  1  0  0
#  0  1  0
#  0  0  1
